<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhyTrack</title>
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1015" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PhyTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url("barlow-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url("barlow-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url("barlow-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url("barlow-condensed-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url("barlow-condensed-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:800;font-display:swap;src:url("barlow-condensed-latin-800-normal.woff2") format("woff2")}
[hidden]{display:none!important}
/* Layout: one quiet column. Hairlines instead of cards, one accent, group colour only as a small dot. */
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --ink:#10161D; --mute:#667385; --line:#E7EAEE; --soft:#EEF0F3;
  --accent:#E8431F; --accent-ink:#FFFFFF;
  --chest:#E8431F; --shoulders:#E59A0B; --back:#0E8F86; --core:#3556D8; --legs:#7B3FC4; --arms:#D6336C; --cardio:#2F9E44; --other:#788494;
  --gl:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1015; --surface:#12181F; --ink:#E9EEF3; --mute:#8896A6; --line:#1F2831; --soft:#18202A;
  --accent:#FF6A45; --accent-ink:#1A0A05; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1015; --surface:#12181F; --ink:#E9EEF3; --mute:#8896A6; --line:#1F2831; --soft:#18202A;
  --accent:#FF6A45; --accent-ink:#1A0A05; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif;min-height:100vh;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:520px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0}
button,input,select{font-family:inherit}
header{padding:24px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font:600 12px/1 Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
header h1{font-size:46px;font-weight:700;line-height:1;margin-top:8px;letter-spacing:.2px}
header h1 span{color:var(--mute);font-weight:600;font-size:24px;margin-left:3px}
.hstats{display:flex;gap:22px;text-align:right}
.hstats b{display:block;font:700 26px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.hstats span{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.bar{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* day strip */
.strip{display:flex;gap:2px;overflow-x:auto;padding:8px var(--gr) 8px var(--gl);margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:42px;height:54px;border-radius:12px;border:0;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.day b{font:600 20px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--mute)}
.day.full i{background:var(--accent)}
.day.today b{color:var(--accent)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel.today b{color:var(--bg)}
.day.sel.has i{background:var(--bg)}
.day.sel.full i{background:var(--accent)}
/* day tools */
.dayrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.dayrow .cnt{font-size:13px;color:var(--mute);margin-right:auto}
.pill{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 13px;font:500 13px Barlow,sans-serif;cursor:pointer;min-height:36px}
.pill:active{background:var(--soft)}
/* groups & exercises */
.grp{display:flex;align-items:center;gap:8px;margin:30px 0 2px;font:600 12px/1 Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.grp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.grp small{margin-left:auto;font:500 12px Barlow,sans-serif;letter-spacing:.04em;text-transform:none;font-variant-numeric:tabular-nums}
.ex{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 0;color:var(--ink);cursor:pointer;min-height:62px}
.ex:active{background:var(--soft)}
.ex .nm{flex:1;min-width:0}
.ex .nm b{display:block;font-weight:500;font-size:16px;overflow-wrap:anywhere}
.ex .nm span{font-size:13px;color:var(--mute)}
.ex .val{font:700 24px/1 "Barlow Condensed",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex .val u{text-decoration:none;font-size:13px;font-weight:600;color:var(--mute);margin-left:2px}
.ex .add{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);font-size:20px;line-height:1}
.pb{font:600 10px Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-left:8px;vertical-align:middle}
.addrow{display:block;width:100%;margin-top:26px;padding:15px;border:1px dashed var(--line);border-radius:14px;background:transparent;color:var(--mute);font:500 15px Barlow,sans-serif;cursor:pointer}
.addrow:active{background:var(--soft)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px var(--gr) calc(6px + env(safe-area-inset-bottom,0px)) var(--gl);z-index:20}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;color:var(--mute);font:500 11px Barlow,sans-serif;letter-spacing:.06em;padding:6px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;border-radius:10px}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.act{color:var(--ink)}
nav button.act svg{stroke:var(--accent)}
/* planner grid */
.gridwrap{overflow:auto;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:0 var(--gr) 8px var(--gl);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-size:13px}
th,td{border-bottom:1px solid var(--line);background:var(--bg);text-align:center;min-width:44px;height:44px;padding:0}
th{position:sticky;top:0;color:var(--mute);font:600 14px "Barlow Condensed",sans-serif;z-index:2;height:34px}
th.cur{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
td.nm,th.nm{position:sticky;left:0;z-index:3;min-width:150px;max-width:150px;text-align:left;padding:0 10px 0 14px;font-weight:500;line-height:1.15}
th.nm{z-index:4;padding-left:0;text-transform:uppercase;letter-spacing:.1em;font:600 11px Barlow,sans-serif}
td.nm i{display:block;font-style:normal;font-size:11px;font-weight:400;color:var(--mute)}
td.nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.nm::before{content:"";position:absolute;left:0;top:19px;width:6px;height:6px;border-radius:50%;background:var(--c)}
td.c{cursor:pointer;font:600 15px "Barlow Condensed",sans-serif}
td.c.col{background:color-mix(in srgb,var(--accent) 7%,var(--bg))}
td.c.f{background:var(--soft)}
.hint{color:var(--mute);font-size:13px;margin:4px 0 12px}
.sec{font:600 12px/1 Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:36px 0 12px;display:flex;align-items:baseline;gap:8px}
.sec small{margin-left:auto;font:400 12px Barlow,sans-serif;letter-spacing:.02em;text-transform:none}
.setrow{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:14px}
.setrow input{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px Barlow,sans-serif;padding:0 10px}
.foot{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font:500 14px Barlow,sans-serif;cursor:pointer}
.link:active{background:var(--soft)}
.link.warn{color:var(--mute)}
.mine{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mine .nm{flex:1;min-width:0}
.mine .nm b{display:block;font-weight:500;overflow-wrap:anywhere}
.mine .nm span{font-size:13px;color:var(--mute)}
/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:10px}
.tile{border-top:1px solid var(--line);padding:14px 0 16px}
.tile b{display:block;font:700 40px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.card{border-top:1px solid var(--line);padding-top:16px}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}
.wk{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:136px;gap:5px;min-width:0}
.wk em{font:600 14px "Barlow Condensed",sans-serif;font-style:normal;font-variant-numeric:tabular-nums;color:var(--mute)}
.wk i{display:block;width:100%;max-width:34px;background:var(--line);border-radius:6px 6px 2px 2px;min-height:4px}
.wk.cur i{background:var(--accent)}
.wk.cur em{color:var(--ink)}
.wk small{font-size:12px;color:var(--mute)}
.gb{display:grid;grid-template-columns:78px 1fr 52px;gap:12px;align-items:center;margin-bottom:12px}
.gb:last-child{margin-bottom:0}
.gb .tr{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.gb .tr i{display:block;height:100%;background:var(--c);border-radius:99px}
.gb b{font:500 14px Barlow,sans-serif}
.gb span{font:600 15px "Barlow Condensed",sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--mute);font-size:13px;margin:12px 0 0}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 96px 62px;gap:10px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);width:100%;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}
.pr:active{background:var(--soft)}
.pr .nm b{display:block;font-weight:500;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.pr .nm span{font-size:12px;color:var(--mute)}
.pr .d{text-align:right}
.pr .d b{display:block;font:700 19px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.pr .d span{font-size:11px;color:var(--mute)}
.pr svg{display:block;width:96px;height:30px}
.nil{color:var(--mute);text-align:center;display:block}
.ins{border-top:1px solid var(--line)}
.in{padding:13px 0;border-bottom:1px solid var(--line)}
.in b{display:block;font-weight:500}
.in span{font-size:13px;color:var(--mute)}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.hc{aspect-ratio:1;border:0;border-radius:6px;background:var(--line);color:var(--mute);font:600 12px "Barlow Condensed",sans-serif;cursor:pointer;padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.hc.l1{background:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--ink)}
.hc.l2{background:color-mix(in srgb,var(--accent) 52%,var(--line));color:var(--ink)}
.hc.l3{background:color-mix(in srgb,var(--accent) 76%,var(--line));color:var(--accent-ink)}
.hc.l4{background:var(--accent);color:var(--accent-ink)}
.hc.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hc.tod{outline:2px solid var(--ink);outline-offset:1px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px;margin-top:4px}
.ds{border-top:1px solid var(--line);padding:11px 0 12px}
.ds b{display:block;font:700 26px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.ds span{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
/* body */
.hero{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;margin-top:14px}
.hero .lbl{font-size:12px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.big{font:700 68px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;margin-top:6px}
.hero .side{text-align:right;font-size:13px;color:var(--mute);line-height:1.55}
.hero .side b{font:600 16px "Barlow Condensed",sans-serif;color:var(--ink);letter-spacing:.3px}
.gauge{position:relative;height:4px;border-radius:99px;background:var(--line);margin:22px 0 8px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.gauge u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{min-width:0}
.fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;letter-spacing:.04em}
.fld input,.fld select{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px "Barlow Condensed",sans-serif;padding:0 12px}
.fld select,.fld input[type=text]{font:500 16px Barlow,sans-serif}
.fld.wide{grid-column:1 / -1}
.hr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.hr b{font:600 17px "Barlow Condensed",sans-serif;letter-spacing:.3px;white-space:nowrap}
.hr span{color:var(--mute);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{font:400 10px Barlow,sans-serif}
.facts{margin:12px 0 0;padding:0;list-style:none;color:var(--mute);font-size:13px;display:grid;gap:4px}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,12,17,.5);z-index:40;display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;padding:14px max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .25s ease;max-width:520px;margin:0 auto;max-height:94%;overflow:auto;visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-size:30px;font-weight:700;line-height:1;overflow-wrap:anywhere}
.sheet .meta{color:var(--mute);font-size:14px;margin:6px 0 18px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{text-align:center;padding:6px 0}
.st label{font-size:12px;color:var(--mute);display:block;letter-spacing:.1em;text-transform:uppercase}
.st .n{font:700 68px/1.05 "Barlow Condensed",sans-serif;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.st .pm{display:flex;gap:14px;justify-content:center}
.st button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font:400 28px/1 Barlow,sans-serif;cursor:pointer}
.st button:active{background:var(--soft)}
.chips{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.beat{margin:12px 0 0;font-size:14px;color:var(--mute);text-align:center;min-height:20px}
.acts{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:16px}
.acts .clr{padding:0 20px;height:54px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--mute);font:500 15px Barlow,sans-serif;cursor:pointer}
.acts .save{height:54px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
.edlink{display:block;margin:14px auto 0;background:none;border:0;color:var(--mute);font:500 13px Barlow,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.xform{display:grid;gap:14px;margin-top:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{height:46px;border:0;background:transparent;color:var(--mute);font:500 15px Barlow,sans-serif;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 var(--gr) 0 var(--gl)}
.rest div{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px}
.rest span{font-size:12px;opacity:.7;letter-spacing:.1em;text-transform:uppercase}
.rest b{font:700 28px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;margin-right:auto}
.rest button{border:1px solid currentColor;border-radius:10px;height:38px;padding:0 14px;background:transparent;color:inherit;font:500 14px Barlow,sans-serif;cursor:pointer}
.rest button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow" id="sub"></div><h1 id="title">Day 1<span>/30</span></h1></div>
    <div class="hstats"><div><b id="streak">0</b><span>streak</span></div><div><b id="pct">0%</b><span>logged</span></div></div>
  </header>
  <div class="bar"><i id="barfill" style="width:0"></i></div>
  <main id="view"></main>
</div>
<div class="rest" id="rest" hidden><div><span>Rest</span><b id="restT">1:00</b><button class="go" data-act="rest+">+15s</button><button data-act="restx">Skip</button></div></div>
<nav aria-label="Sections"><div>
  <button data-tab="today" class="act"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>Today</button>
  <button data-tab="grid"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Planner</button>

<script>
var N=30;
var BASE=[
 {id:"wp",n:"Wide Push-ups",m:"Chest",g:"Chest"},
 {id:"sp",n:"Standard Push-ups",m:"Chest",g:"Chest"},
 {id:"dp",n:"Decline Push-ups",m:"Upper chest, feet up",g:"Chest"},
 {id:"di",n:"Diamond Push-ups",m:"Triceps",g:"Chest"},
 {id:"pk",n:"Pike Push-ups",m:"Shoulders",g:"Shoulders"},
 {id:"ep",n:"Elevated Pike Push-ups",m:"Shoulders",g:"Shoulders"},
 {id:"lw",n:"Lateral Walk Push-ups",m:"Shoulders",g:"Shoulders"},
 {id:"wg",n:"Wide-Grip Pull-ups",m:"Lats, V-width",g:"Back"},
 {id:"ch",n:"Chin-ups",m:"Lats, biceps",g:"Back"},
 {id:"ir",n:"Inverted Table Rows",m:"Mid back",g:"Back"},
 {id:"sh",n:"Superman Hold",m:"Lower back",g:"Back",sec:1},
 {id:"hl",n:"Hanging Leg Raises",m:"Lower abs",g:"Core"},
 {id:"bc",n:"Bicycle Crunches",m:"Abs, obliques",g:"Core"},
 {id:"pl",n:"Plank Hold",m:"Core",g:"Core",sec:1},
 {id:"mc",n:"Mountain Climbers",m:"Abs, cardio",g:"Core"},
 {id:"bs",n:"Bulgarian Split Squats",m:"Legs",g:"Legs"}
];
var EX=BASE.slice();
var GROUPS=["Chest","Shoulders","Back","Core","Legs","Arms","Cardio","Other"];
var COL={Chest:"var(--chest)",Shoulders:"var(--shoulders)",Back:"var(--back)",Core:"var(--core)",Legs:"var(--legs)",Arms:"var(--arms)",Cardio:"var(--cardio)",Other:"var(--other)"};
var KEY="vtaper30.v1", TKEY="vtaper30.theme", BKEY="vtaper30.bak", GOLD=1.618;
var S={start:null,log:{},meas:{},rest:60,t:0}; // log[exId][day]=[sets,reps]; meas[day]={sh,ch,wa,wt}; ex=[{id,n,m,g,sec}] is the full exercise list, seeded from BASE on first run
var tab="today", sel=1, edit=null, xedit=null, xtype="reps", cur={s:3,r:10}, bd=1, resetArmed=false, delArmed=false, dsel=null;
var restEnd=0, restIv=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function lsGet(){try{var v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today0(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function pad(n){return String(n).padStart(2,"0")}
function fmtD(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function dayDate(d){var x=parseD(S.start);x.setDate(x.getDate()+d-1);return x}
function dayLabel(d,o){return dayDate(d).toLocaleDateString(undefined,o||{weekday:"short",day:"numeric",month:"short"})}
function todayNum(){var n=Math.round((today0()-parseD(S.start))/864e5)+1;return Math.max(1,Math.min(N,n))}
function fin(x){return typeof x==="number"&&isFinite(x)}
function norm(o){
  o=(o&&typeof o==="object")?o:{};
  var r={start:null,log:{},meas:{},ex:[],rest:60,t:+o.t||0};
  if(typeof o.start==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(o.start))r.start=o.start;
  if(fin(o.rest)&&o.rest>=0&&o.rest<=600)r.rest=o.rest;
  var ids={};
  function addEx(c){
    if(!c||typeof c!=="object")return;
    var id=String(c.id||""),n=String(c.n||"").trim().slice(0,40),m=String(c.m||"").trim().slice(0,40);
    if(!/^[a-z0-9]{1,20}$/i.test(id)||ids[id]||!n)return;
    ids[id]=1;r.ex.push({id:id,n:n,m:m,g:GROUPS.indexOf(c.g)>=0?c.g:"Other",sec:c.sec?1:0});
  }
  if(Array.isArray(o.ex))o.ex.slice(0,120).forEach(addEx);
  else{BASE.forEach(addEx);if(Array.isArray(o.custom))o.custom.slice(0,80).forEach(addEx)} // first run, or data saved by an older version
  if(o.log&&typeof o.log==="object")for(var k in o.log){
    var l=o.log[k];if(!ids[k]||!l||typeof l!=="object")continue;
    for(var d in l){var v=l[d],dn=+d;
      if(Array.isArray(v)&&fin(+v[0])&&fin(+v[1])&&+v[0]>0&&+v[1]>0&&dn>=1&&dn<=N){r.log[k]=r.log[k]||{};r.log[k][dn]=[Math.round(+v[0]),Math.round(+v[1])]}}
  }
  if(o.meas&&typeof o.meas==="object")for(var d2 in o.meas){var m2=o.meas[d2],dn2=+d2;
    if(!m2||typeof m2!=="object"||!(dn2>=1&&dn2<=N))continue;
    var q={};["sh","ch","wa","wt"].forEach(function(f){if(fin(m2[f])&&m2[f]>0)q[f]=m2[f]});
    if(Object.keys(q).length)r.meas[dn2]=q;
  }
  return r;
}
function refreshEx(){EX=S.ex.slice()}
function missingDefaults(){return BASE.filter(function(b){return !S.ex.some(function(e){return e.id===b.id})})}
function groupsUsed(){return GROUPS.filter(function(g){return EX.some(function(e){return e.g===g})})}
function load(){
  var d=lsGet(); S=norm(d&&d.start?d:S);
  if(!S.start){S.start=fmtD(today0());S.t=Date.now()}
  lsSet(); refreshEx(); sel=todayNum(); bd=sel;
}
function persist(){S.t=Date.now();lsSet()}
function get(id,d){var l=S.log[id];return l&&l[d]?l[d]:null}
function vol(v){return v?v[0]*v[1]:0}
function best(id,beforeDay){var b=0,l=S.log[id]||{};for(var k in l){if(beforeDay&&+k>=beforeDay)continue;b=Math.max(b,vol(l[k]))}return b}
function prev(id,d){for(var i=d-1;i>=1;i--){var v=get(id,i);if(v)return v}return null}
function count(d){var c=0;EX.forEach(function(e){if(get(e.id,d))c++});return c}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show")},2200)}
function unit(e){return e.sec?"s":""}

/* theme: auto follows the device, light and dark force it */
function themeGet(){try{return localStorage.getItem(TKEY)||"auto"}catch(e){return"auto"}}
function themeApply(m){var r=document.documentElement;if(m==="light"||m==="dark")r.setAttribute("data-theme",m);else r.removeAttribute("data-theme")}
function themeNext(){var m=themeGet(),n=m==="auto"?"light":m==="light"?"dark":"auto";try{localStorage.setItem(TKEY,n)}catch(e){}themeApply(n);render()}

/* streaks and totals */
function streakNow(){var tn=todayNum(),st=0,d=tn;if(!count(d))d--;while(d>=1&&count(d)){st++;d--}return st}
function streakBest(){var b=0,r=0;for(var d=1;d<=N;d++){if(count(d)){r++;b=Math.max(b,r)}else r=0}return b}
function stats(){
  var reps=0,sets=0,secs=0,active=0,gr={},wk=[0,0,0,0,0];
  GROUPS.forEach(function(g){gr[g]=0});
  for(var d=1;d<=N;d++){var any=false;
    EX.forEach(function(e){var v=get(e.id,d);if(!v)return;any=true;sets+=v[0];
      if(e.sec)secs+=v[0]*v[1];else{var r=v[0]*v[1];reps+=r;gr[e.g]+=r;wk[Math.min(4,Math.floor((d-1)/7))]+=r}});
    if(any)active++}
  return {reps:reps,sets:sets,secs:secs,active:active,gr:gr,wk:wk};
}

function header(){
  var tn=todayNum();
  $("title").innerHTML="Day "+sel+"<span>/"+N+"</span>";
  $("sub").textContent=dayLabel(sel,{weekday:"long",day:"numeric",month:"short"})+(sel===tn?" · today":"");
  var tot=0;for(var d=1;d<=N;d++)tot+=count(d);
  var p=EX.length?Math.round(tot/(EX.length*N)*100):0;
  $("pct").textContent=p+"%";
  $("barfill").style.width=p+"%";
  $("streak").textContent=streakNow();
}
function stripHtml(){
  var tn=todayNum(),h='<div class="strip" id="strip">';
  for(var d=1;d<=N;d++){var c=count(d);
    h+='<button class="day'+(c?' has':'')+(c&&c===EX.length?' full':'')+(d===sel?' sel':'')+(d===tn?' today':'')+'" data-day="'+d+'" aria-label="Day '+d+', '+c+' of '+EX.length+' logged"><b>'+d+'</b><i></i></button>'}
  return h+'</div>';
}
function valHtml(e,v){return v?v[0]+'×'+v[1]+'<u>'+unit(e)+'</u>':''}
function canCopy(){
  if(sel<2)return false;
  return EX.some(function(e){return !get(e.id,sel)&&get(e.id,sel-1)});
}
function todayView(){
  var h=stripHtml(),done=count(sel);
  h+='<div class="dayrow"><span class="cnt">'+done+' of '+EX.length+' logged'+(EX.length&&done===EX.length?' · day complete':'')+'</span>'
    +(canCopy()?'<button class="pill" data-act="copy">Copy day '+(sel-1)+'</button>':'')
    +'<button class="pill" data-act="restcycle">Rest '+(S.rest?S.rest+'s':'off')+'</button></div>';
  groupsUsed().forEach(function(g){
    var list=EX.filter(function(e){return e.g===g}),dn=list.filter(function(e){return get(e.id,sel)}).length;
    h+='<div class="grp" style="--c:'+COL[g]+'">'+g+'<small>'+dn+'/'+list.length+'</small></div>';
    list.forEach(function(e){
      var v=get(e.id,sel),b=best(e.id,sel),isPb=v&&vol(v)>b&&b>0;
      h+='<button class="ex" data-ex="'+e.id+'"><div class="nm"><b>'+esc(e.n)+(isPb?'<span class="pb">New best</span>':'')+'</b>'+(e.m?'<span>'+esc(e.m)+'</span>':'')+'</div>'+(v?'<div class="val">'+valHtml(e,v)+'</div>':'<div class="add">+</div>')+'</button>';
    });
  });
  if(!EX.length)h+='<p class="hint" style="margin-top:28px">No exercises yet. Add your first one, or restore the original plan from Planner.</p>';
  h+='<button class="addrow" data-act="addex">+ Add an exercise</button>';
  if(EX.length)h+='<p class="hint" style="text-align:center;margin:10px 0 0">Tap an exercise, then "Edit this exercise" to rename or remove it.</p>';
  return h;
}
function bestLabel(e){var b=null,bv=0,l=S.log[e.id]||{};for(var k in l){if(vol(l[k])>bv){bv=vol(l[k]);b=l[k]}}return b?b[0]+'×'+b[1]+unit(e):'—'}
function gridView(){
  var tn=todayNum();
  var h='<p class="hint">Scroll sideways. Tap any box to log or edit that day.</p><div class="gridwrap"><table><thead><tr><th class="nm">Exercise</th>';
  for(var d=1;d<=N;d++)h+='<th class="'+(d===tn?'cur':'')+'">'+d+'</th>';
  h+='</tr></thead><tbody>';
  EX.forEach(function(e){
    h+='<tr><td class="nm" style="--c:'+COL[e.g]+'"><b>'+esc(e.n)+'</b><i>best '+(best(e.id)?bestLabel(e):'—')+'</i></td>';
    for(var d=1;d<=N;d++){var v=get(e.id,d);h+='<td class="c'+(v?' f':'')+(d===tn?' col':'')+'" data-ex="'+e.id+'" data-day="'+d+'">'+(v?v[0]+'×'+v[1]:'')+'</td>'}
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<h3 class="sec">Exercises<small>'+S.ex.length+' in your plan</small></h3>';
  h+='<p class="hint" style="margin:0 0 4px">Rename, change or remove any exercise, including the original ones. Removing one also deletes its logs.</p>';
  S.ex.forEach(function(c){
    h+='<div class="mine"><div class="nm"><b>'+esc(c.n)+'</b><span>'+c.g+' · '+(c.sec?'seconds':'reps')+(c.m?' · '+esc(c.m):'')+'</span></div><button class="link" data-act="editex" data-id="'+c.id+'">Edit</button></div>';
  });
  var md=missingDefaults();
  h+='<div class="foot"><button class="link" data-act="addex">+ Add exercise</button>'+(md.length?'<button class="link" data-act="restoredef">Restore original exercises ('+md.length+')</button>':'')+'</div>';
  var tm=themeGet();
  h+='<h3 class="sec">Settings</h3>'
   +'<div class="setrow"><label for="startIn">Day 1 is</label><input type="date" id="startIn" value="'+S.start+'"></div>'
   +'<p class="hint" style="margin-top:8px">Changing the start date moves the calendar. Logged days keep their day numbers.</p>'
   +'<div class="foot"><button class="link" data-act="theme">Theme: '+(tm==="auto"?"Auto":tm==="light"?"Light":"Dark")+'</button></div>'
   +'<h3 class="sec">Backup<small>'+bakText()+'</small></h3>'
   +'<p class="hint" style="margin-top:0">Your data lives on this phone. A backup file is your safety copy.</p>'
   +'<div class="foot" style="margin-top:0"><button class="link" data-act="bak">Save backup</button><button class="link" data-act="imp">Restore backup</button><button class="link" data-act="csv">Export CSV</button><button class="link warn" id="reset">Reset all data</button></div>';
  return h;
}

/* progress */
function spark(e){
  var pts=[];for(var d=1;d<=N;d++){var v=get(e.id,d);if(v)pts.push([d,vol(v)])}
  if(!pts.length)return '<span class="nil">—</span>';
  var W=96,H=30,P=4,vs=pts.map(function(p){return p[1]}),mx=Math.max.apply(null,vs),mn=Math.min.apply(null,vs);
  if(mx===mn){mx+=1;mn-=1}
  var xy=pts.map(function(p){return [P+(p[0]-1)/(N-1)*(W-2*P),H-P-(p[1]-mn)/(mx-mn)*(H-2*P)]});
  var line=xy.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" "),L=xy[xy.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(e.n)+' trend"><polyline points="'+line+'" style="fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><circle cx="'+L[0].toFixed(1)+'" cy="'+L[1].toFixed(1)+'" r="3.2" style="fill:var(--c)"/></svg>';
}
function deltaOf(e){
  var f=null,l=null,c=0;for(var d=1;d<=N;d++){var v=get(e.id,d);if(v){c++;if(f===null)f=vol(v);l=vol(v)}}
  if(!c)return {t:"—",s:"no data"};
  if(c===1)return {t:"Start",s:"first log"};
  var p=Math.round((l-f)/f*100);return {t:(p>0?"+":"")+p+"%",s:"since first"};
}
function weekCmp(){
  var tn=todayNum(),cw=Math.floor((tn-1)/7);if(cw<1)return null;
  var k=((tn-1)%7)+1,a=0,b=0;
  EX.forEach(function(e){if(e.sec)return;for(var i=1;i<=k;i++){var v1=get(e.id,cw*7+i),v0=get(e.id,(cw-1)*7+i);if(v1)a+=vol(v1);if(v0)b+=vol(v0)}});
  return {a:a,b:b,k:k,c1:cw*7+1,c0:(cw-1)*7+1};
}
function insights(s){
  var out=[],tn=todayNum();
  if(!s.sets)return out;
  var wc=weekCmp();
  if(wc&&wc.b>0){var p=Math.round((wc.a-wc.b)/wc.b*100);
    out.push({t:p===0?"Level with last week":(p>0?"Up ":"Down ")+Math.abs(p)+"% on last week",d:wc.a+" reps on days "+wc.c1+"–"+(wc.c1+wc.k-1)+" against "+wc.b+" on days "+wc.c0+"–"+(wc.c0+wc.k-1)})}
  var bg=null;
  EX.forEach(function(e){var f=null,l=null,c=0,fd=0;
    for(var d=1;d<=N;d++){var v=get(e.id,d);if(v){c++;if(f===null){f=vol(v);fd=d}l=vol(v)}}
    if(c>1&&f>0){var q=(l-f)/f;if(q>0&&(!bg||q>bg.q))bg={e:e,q:q,fd:fd}}});
  if(bg)out.push({t:bg.e.n+" is your biggest gain",d:"+"+Math.round(bg.q*100)+"% volume since day "+bg.fd});
  var ng=null;
  EX.forEach(function(e){var last=0;for(var d=1;d<=N;d++)if(get(e.id,d))last=d;
    if(last&&tn-last>=3&&(!ng||last<ng.last))ng={e:e,last:last}});
  if(ng)out.push({t:"You haven't done "+ng.e.n+" for "+(tn-ng.last)+" days",d:"Last logged on day "+ng.last});
  var used=groupsUsed().filter(function(g){return EX.some(function(e){return e.g===g&&!e.sec})});
  if(used.length>=3&&s.reps>0){var lo=null;
    used.forEach(function(g){var sh=s.gr[g]/s.reps;if(!lo||sh<lo.sh)lo={g:g,sh:sh}});
    if(lo.sh<0.10)out.push({t:lo.g+" is only "+Math.round(lo.sh*100)+"% of your reps",d:"Add a few sets to keep your build even"})}
  var tr=0;for(var d2=1;d2<=tn;d2++)if(count(d2))tr++;
  out.push({t:"Trained "+tr+" of "+tn+" days",d:Math.round(tr/tn*100)+"% consistency. Best streak "+streakBest()+" days"});
  return out;
}
function insightsHtml(s){
  var list=insights(s);if(!list.length)return '';
  var h='<h3 class="sec">What stands out</h3><div class="ins">';
  list.forEach(function(i){h+='<div class="in"><b>'+esc(i.t)+'</b><span>'+esc(i.d)+'</span></div>'});
  return h+'</div>';
}
function heatHtml(){
  var tn=todayNum(),h='<h3 class="sec">Consistency<small>darker = more logged · tap a day</small></h3><div class="heat">';
  for(var d=1;d<=N;d++){var c=count(d),r=EX.length?c/EX.length:0,lv=!c?0:r<=.25?1:r<=.5?2:r<=.75?3:4;
    h+='<button class="hc'+(lv?' l'+lv:'')+(d>tn?' fut':'')+(d===tn?' tod':'')+'" data-goday="'+d+'" aria-label="Day '+d+', '+c+' of '+EX.length+' logged">'+d+'</button>'}
  return h+'</div>';
}
function detailChart(e,pts){
  if(pts.length<2)return '<p class="hint" style="margin:14px 0 0">Log this exercise on two different days to draw its line.</p>';
  var W=320,H=170,L=38,R=10,T=14,B=24,pw=W-L-R,ph=H-T-B,mx=Math.max.apply(null,pts.map(function(p){return p.vol}))*1.1;
  function X(d){return L+(d-1)/(N-1)*pw}
  function Y(v){return T+(1-v/mx)*ph}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(e.n)+' volume by day">';
  [0,0.5,1].forEach(function(f){var v=mx/1.1*f,y=Y(v);

/* body */
function ser(k){var o=[];for(var d=1;d<=N;d++){var m=S.meas[d];if(m&&typeof m[k]==="number")o.push([d,m[k]])}return o}
function ratios(){var o=[];for(var d=1;d<=N;d++){var m=S.meas[d];if(m&&m.sh&&m.wa)o.push([d,m.sh/m.wa])}return o}
function chg(k,u){var a=ser(k);if(a.length<2)return null;var x=a[a.length-1][1]-a[0][1];return (x>0?"+":x<0?"−":"")+Math.abs(x).toFixed(1)+" "+u}
function ratioChart(rs){
  var W=320,H=150,L=40,R=12,T=14,B=22,pw=W-L-R,ph=H-T-B,vals=rs.map(function(r){return r[1]});
  var lo=Math.min.apply(null,vals)-0.04,hi=Math.max(GOLD,Math.max.apply(null,vals))+0.04;
  function X(d){return L+(d-1)/(N-1)*pw}
  function Y(v){return T+(1-(v-lo)/(hi-lo))*ph}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Shoulder to waist ratio over time">';
  s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" style="stroke:var(--line);stroke-width:1"/>';
  s+='<line x1="'+L+'" y1="'+Y(GOLD).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(GOLD).toFixed(1)+'" style="stroke:var(--ink);stroke-width:1;stroke-dasharray:4 3"/>';
  s+='<text x="'+(L-6)+'" y="'+(Y(GOLD)+3.5).toFixed(1)+'" text-anchor="end" style="fill:var(--ink)">1.618</text>';
  s+='<text x="'+(L-6)+'" y="'+(T+ph+3.5)+'" text-anchor="end" style="fill:var(--mute)">'+lo.toFixed(2)+'</text>';
  s+='<text x="'+L+'" y="'+(H-6)+'" text-anchor="start" style="fill:var(--mute)">Day 1</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" style="fill:var(--mute)">Day '+N+'</text>';
  var pts=rs.map(function(r){return X(r[0]).toFixed(1)+","+Y(r[1]).toFixed(1)}).join(" ");
  s+='<polyline points="'+pts+'" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>';
  rs.forEach(function(r,i){var last=i===rs.length-1;s+='<circle cx="'+X(r[0]).toFixed(1)+'" cy="'+Y(r[1]).toFixed(1)+'" r="'+(last?4.5:3)+'" style="fill:'+(last?'var(--accent)':'var(--bg)')+';stroke:var(--accent);stroke-width:2"/>'});
  var q=rs[rs.length-1],qx=Math.min(X(q[0]),W-R-14);
  s+='<text x="'+qx.toFixed(1)+'" y="'+(Y(q[1])-9).toFixed(1)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+q[1].toFixed(2)+'</text>';
  return s+'</svg>';
}

  var rs=ratios(),h='',last=rs.length?rs[rs.length-1]:null;

   +'<div class="acts"><button class="clr" data-act="mclr" id="mClr">Clear day</button><button class="save" data-act="msave">Save day '+bd+'</button></div>';
  h+='<h3 class="sec">Ratio over time</h3><div class="card chartbox">';

    if(m.sh)bits.push('Sh '+m.sh);if(m.ch)bits.push('Ch '+m.ch);if(m.wa)bits.push('Wa '+m.wa);if(m.wt)bits.push(m.wt+' kg');
    h+='<div class="hr"><b>Day '+k+'</b><span>'+bits.join(' · ')+(m.sh&&m.wa?' · <strong style="color:var(--ink)">'+(m.sh/m.wa).toFixed(2)+'</strong>':'')+'</span></div>'});
  return h+'</div>';
}

  var rows=["Exercise,"+Array.from({length:N},function(_,i){return "Day "+(i+1)}).join(",")];
  EX.forEach(function(e){var r=[csvQ(e.n)];for(var d=1;d<=N;d++){var v=get(e.id,d);r.push(v?v[0]+"x"+v[1]:"")}rows.push(r.join(","))});

  if(a==="xdel"){delEx();return}
  if(a==="restcycle"){var o=[0,30,45,60,90,120],i=o.indexOf(S.rest);S.rest=o[(i+1)%o.length];persist();if(!S.rest)stopRest();render();return}
  if(a==="rest+"){restEnd+=15000;tick();return}
  if(a==="restx"){stopRest();return}
  if(a==="same"&&edit&&edit.pv){cur={s:edit.pv[0],r:edit.pv[1]};upd();return}
  if(a==="beat"&&edit&&edit.pv){cur={s:edit.pv[0],r:Math.min(edit.e.sec?600:200,edit.pv[1]+(edit.e.sec?5:1))};upd();return}
  if(a==="theme"){themeNext();return}
  if(a==="bak"){if(saveFile("phytrack-backup.json",JSON.stringify(S),"application/json")){bakSet();toast("Backup saved. Keep the file somewhere safe.");render()}return}
  if(a==="csv"){saveFile("phytrack-log.csv",csvText(),"text/csv");return}
  if(a==="imp"){$("imp").click();return}
  if(a==="msave"){saveBody();return}
  if(a==="mclr"){delete S.meas[bd];persist();render();toast("Cleared day "+bd);return}
  if(t.dataset.day&&t.classList.contains("day")){sel=+t.dataset.day;render();return}
  if(t.dataset.ex){openSheet(t.dataset.ex,t.dataset.day?+t.dataset.day:sel);return}
  if(t.dataset.k){var k=t.dataset.k,e=edit.e,step=(k==="r"&&e.sec)?5:1;cur[k]=Math.max(1,Math.min(k==="s"?15:(e.sec?600:200),cur[k]+step*(+t.dataset.d)));upd();return}
  if(t.id==="save"){commit([cur.s,cur.r]);return}
  if(t.id==="clr"){commit(null);return}
  if(t.id==="reset"){
    if(!resetArmed){resetArmed=true;t.textContent="Tap again to erase everything";setTimeout(function(){resetArmed=false;var b=$("reset");if(b)b.textContent="Reset all data"},3500);return}
    resetArmed=false;stopRest();S={start:null,log:{},meas:{},rest:60,t:0};try{localStorage.removeItem(KEY)}catch(x){}load();persist();render();toast("All data cleared");return
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="mDay"){bd=+t.value;fillBody();var s=document.querySelector('[data-act="msave"]');if(s)s.textContent="Save day "+bd}
  if(t.id==="startIn"&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){S.start=t.value;persist();sel=todayNum();bd=sel;render();toast("Day 1 is now "+dayLabel(1,{day:"numeric",month:"short"}))}
});
$("xName").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();saveEx()}});
$("imp").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||typeof o!=="object"||!o.log||!/^\d{4}-\d{2}-\d{2}$/.test(o.start||""))throw 0;S=norm(o);refreshEx();persist();sel=todayNum();bd=sel;render();toast("Backup restored")}catch(e){toast("That file is not a PhyTrack backup")}};
  r.onerror=function(){toast("Could not read that file")};
  r.readAsText(f);ev.target.value="";
});
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});

themeApply(themeGet());
load();render();

// Offline support and durable storage
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
setTimeout(function(){var any=false;for(var k in S.log){for(var d in S.log[k]){any=true;break}if(any)break}
  if(any&&(Date.now()-bakGet())>7*864e5)toast("Tip: save a backup from Planner")},1500);
</script>
</body>
</html>
